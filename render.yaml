services:
  - type: web
    name: rca-tool
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # "free" also works, but spins down after ~15 min idle
    healthCheckPath: /api/health
    envVars:
      - key: FRED_API_KEY
        sync: false        # set this in the Render dashboard, never in git
      - key: FRED_REFRESH_HOURS
        value: "12"
      - key: FRED_CACHE_PATH
        value: /tmp/rca_yield_cache.json
